
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HSE培训合格证生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* 第一步：加载自定义字体，填写你的字体文件路径 */
        @font-face {
            font-family: "FZDaHei";
            /* 这里改成你存放方正大黑简体字体的路径，支持ttf、woff、woff2 */
            src: url('FZDHTJW.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }
        body {
            font-family: "SimSun", serif;
            background-color: #f0f2f5;
            padding: 30px;
            margin: 0;
        }
        /* 字体预加载，解决html2canvas导出字体丢失 */
        .font-preload{
            font-family:"FZDaHei";
            position:absolute;
            top:-9999px;
            visibility: hidden;
            content:"预加载文字";
        }
        .control-panel{
            background:#ffffff;
            padding: 24px 28px;
            border-radius: 12px;
            margin-bottom: 24px;
            max-width: 1343px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-panel label{
            font-size: 17px;
            font-weight: 500;
        }
        .control-panel input{
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #d0d7e3;
            border-radius: 6px;
            outline: none;
            transition: 0.2s;
        }
        .control-panel input:focus{
            border-color:#2b5797;
        }
        button{
            padding: 9px 24px;
            background:#2b5797;
            color:white;
            border:none;
            border-radius: 6px;
            cursor:pointer;
            font-size: 16px;
            transition: background-color 0.25s;
        }
        button:hover{
            background-color:#204273;
        }
        button:disabled{
            background-color:#708cb8;
            cursor:not-allowed;
        }
        .cert-wrap{
            position:relative;
            width:1480px;
            height:960px;
            overflow:hidden;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
            border-radius: 4px;
        }
        .bg-img{
            width: 100%;
            height: 100%;
            display:block;
        }
        /* 左侧照片区域 */
        .photo-box{
            position:absolute;
            top:335px;
            left:103px;
            width:450px;
            height:550px;
            border:0;
            object-fit:cover;
        }
        .name{
            position:absolute;
            top: 355px;
            left: 1070px;
            font-size: 55px;
            font-family:"FZDaHei",sans-serif;
            font-weight:500;
            letter-spacing:2px;
        }
        .post{
            position:absolute;
            top: 530px;
            left: 1070px;
            font-size: 55px;
            font-family:"FZDaHei",sans-serif;
            font-weight:500;
            letter-spacing:2px;
        }
        .valid{
            position:absolute;
            top: 635px;
            left: 955px;
            font-size: 45px;
            font-family: "SimSun", serif;
            font-weight:bolder;
            letter-spacing:-4px;
        }
        .code{
            position:absolute;
            top: 725px;
            left: 980px;
            font-size: 43px;
            font-family:"FZDaHei",sans-serif;
            font-weight:300;
            letter-spacing:-4px;
        }
    </style>
</head>
<body>
    <!-- 预加载方正大黑简体文字，解决导出字体丢失 -->
    <div class="font-preload">方正大黑简体预加载测试文字</div>
    <div class="control-panel">
        <label>上传照片：</label>
        <input type="file" id="inp_photo" accept="image/*">
        <label>姓名：</label>
        <input type="text" id="inp_name" oninput="refreshPreview()">
        <label>岗位职位：</label>
        <input type="text" id="inp_post" oninput="refreshPreview()">
        <label>有效期：</label>
        <input type="text" id="inp_date" value="2026.03.01-2028.04.01" oninput="refreshPreview()">
        <label>证书编号：</label>
        <input type="text" id="inp_code" oninput="refreshPreview()">   
        <button id="exportBtn" onclick="exportImage()">导出证书图片</button>
    </div>
    <div class="cert-wrap" id="certContainer">
        <img class="bg-img" id="bgImage" src="15.png" alt="HSE合格证背景">
        <img class="photo-box" id="userPhoto" src="1.png">
        <div class="name" id="text_name"></div>
        <div class="post" id="text_post"></div>
        <div class="valid" id="text_valid"></div> 
        <div class="code" id="text_code"></div>   
    </div>
    <script>
        //照片上传监听
        const photoInput = document.getElementById('inp_photo');
        photoInput.addEventListener('change',function(e){
            const file = e.target.files[0];
            if(file){
                const reader = new FileReader();
                reader.onload = function(ev){
                    document.getElementById('userPhoto').src = ev.target.result;
                }
                reader.readAsDataURL(file);
            }
        })
        function refreshPreview(){
            document.getElementById('text_name').innerText = document.getElementById('inp_name').value;
            document.getElementById('text_post').innerText = document.getElementById('inp_post').value;
            document.getElementById('text_valid').innerText = document.getElementById('inp_date').value;
            document.getElementById('text_code').innerText = document.getElementById('inp_code').value;
        }
        async function exportImage(){
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;
            btn.innerText = "导出中...";
            const dom = document.getElementById('certContainer');
            //延长等待时间，等字体完全加载渲染完成
            await new Promise(resolve=>setTimeout(resolve,800));
            const canvas = await html2canvas(dom,{
                useCORS:true,
                allowTaint:true,
                scale: 1,
                scrollX: 0,
                scrollY: 0,
                letterRendering:true
            });
            let link = document.createElement('a');
            link.download = "HSE合格证_"+document.getElementById('inp_name').value+".png";
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.disabled = false;
            btn.innerText = "导出证书图片";
        }
    </script>
</body>
</html>
