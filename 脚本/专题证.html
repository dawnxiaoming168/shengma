<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>专题结业证书生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* 引入宋体字体文件，字体放在html同目录 */
        @font-face {
            font-family: "MySimSun";
            src: url('simsun.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }
        body {
            font-family: "MySimSun", "SimSun", serif;
            background-color: #f0f2f5;
            padding: 30px;
            margin: 0;
        }
        /* 预加载宋体，保证html2canvas渲染 */
        .font-preload{
            font-family:"MySimSun";
            position:absolute;
            top:-9999px;
            visibility:hidden;
        }
        .control-panel{
            background:#ffffff;
            padding: 24px 28px;
            border-radius: 12px;
            margin-bottom: 24px;
            max-width: 1343px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-panel label{
            font-size: 17px;
            font-weight: 500;
        }
        .control-panel input{
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #d0d7e3;
            border-radius: 6px;
            outline: none;
            transition: 0.2s;
        }
        .control-panel input:focus{
            border-color:#2b5797;
        }
        button{
            padding: 9px 24px;
            background:#2b5797;
            color:white;
            border:none;
            border-radius: 6px;
            cursor:pointer;
            font-size: 16px;
            transition: background-color 0.25s;
        }
        button:hover{
            background-color:#204273;
        }
        button:disabled{
            background-color:#708cb8;
            cursor:not-allowed;
        }
        .cert-wrap{
            position:relative;
            width:1343px;
            height:960px;
            overflow:hidden;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
            border-radius: 4px;
        }
        .bg-img{
            width: 100%;
            height: 100%;
            display:block;
        }
        .name{
            position:absolute;
            top: 360px;
            left: 200px;
            font-size: 38px;
            font-family:"MySimSun","SimSun",serif;
            letter-spacing:2px;
        }
        .code{
            position:absolute;
            top: 595px;
            left: 345px;
            font-size: 35px;
            font-family:"MySimSun","SimSun",serif;
            letter-spacing:2px;
        }
        .valid{
            position:absolute;
            top: 640px;
            left: 300px;
            font-size: 33px;
            font-family:"MySimSun","SimSun",serif;
            letter-spacing:2px;
        }
    </style>
</head>
<body>
    <div class="font-preload">宋体预加载测试文字</div>
    <div class="control-panel">
        <label>姓名：</label>
        <input type="text" id="inp_name" oninput="refreshPreview()">
        <label>证书编号：</label>
        <input type="text" id="inp_code" oninput="refreshPreview()">
        <label>有效期：</label>
        <input type="text" id="inp_date" value="2029年4月1日" oninput="refreshPreview()">
        <button id="exportBtn" onclick="exportImage()">导出证书图片</button>
    </div>
    <div class="cert-wrap" id="certContainer">
        <img class="bg-img" id="bgImage" src="https://dawnxiaoming168.github.io/shengma/%E8%84%9A%E6%9C%AC/12.png" alt="证书背景">
        <div class="name" id="text_name"></div>
        <div class="code" id="text_code"></div>
        <div class="valid" id="text_valid"></div>
    </div>
    <script>
        function refreshPreview(){
            document.getElementById('text_name').innerText = document.getElementById('inp_name').value;
            document.getElementById('text_code').innerText = document.getElementById('inp_code').value;
            document.getElementById('text_valid').innerText = document.getElementById('inp_date').value;
        }
        async function exportImage(){
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;
            btn.innerText = "导出中...";
            const dom = document.getElementById('certContainer');
            //延长等待，字体加载完成再导出
            await new Promise(resolve=>setTimeout(resolve, 800));
            const canvas = await html2canvas(dom,{
                useCORS:true,
                allowTaint:true,
                scale: 1,
                scrollX: 0,
                scrollY: 0,
                letterRendering:true
            });
            let link = document.createElement('a');
            link.download = "结业证书_"+document.getElementById('inp_name').value+".png";
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.disabled = false;
            btn.innerText = "导出证书图片";
        }
    </script>
</body>
</html>
